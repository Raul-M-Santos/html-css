<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>

  <!-- Usando o output, diferente do input o output é para exibirmos algo para o usr, nesse caso estamos solicitando 2 valores em 2 campos usando Javascript para somar os dois e exibir o resultado do output (O output não envia ou salva qualquer tipo de dados diferente do input)-->
  <body>
    <h1>Teste de Formulário</h1>

    <form action="" method="get">
      <p>
        <label for="in1">Primero Número:</label>
        <input
          type="number"
          name="n1"
          id="in1"
          min="0"
          max="50"
          required
          oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)"
        />
      </p>

      <p>
        <label for="in2">Segundo Número:</label>
        <input
          type="number"
          name="n2"
          id="in2"
          min="0"
          max="50"
          required
          oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)"
        />
      </p>

      <p>
        <label for="isoma">Soma:</label>
        <output id="isoma" name="soma">0</output>
      </p>

      <p>
        <input type="submit" value="Envie" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
