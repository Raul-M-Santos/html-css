<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
      div.container {
        display: flex;
        background-color: aqua;
      }

      div.item {
        text-align: center;
        flex: auto;
        border: 1px solid black;
      }
    </style>
  </head>

  <!-- Podemos usar Flexbox quando quisermos criar uma caixa com items flexiveis que se ajustam ao tamanho do container pai no exemplo acima criamos a div container e colocamos items dentro dela, por serem outras divs elas são boxlevel ou seja pegam a linha inteira mas ao aplicar o display flex no container pai os item já se agrupam dentro da div, como elas vão se agrupar dentro da tag pai é configuravel  -->
   
  <body>
    <div class="container">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item">F</div>
      <div class="item">G</div>
    </div>
  </body>
</html>
