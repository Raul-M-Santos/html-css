<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
      div.container {
        margin: auto;
        height: 100px;
        display: flex;
        flex-flow: column wrap;
        background-color: aqua;
        
        max-width: 981px;
      }

      div.item {
        flex: auto;
        background-color: yellow;
        text-align: center;
        border: 1px solid black;
      }
    </style>
  </head>

  <!-- 
    Flexwrap

    É uma configuração do flex box para derterminarmos como os conteudos vão se organizar dentro do tamanho do container pai temos algumas como "flex-wrap: nowrap;" (essa é que vem por padrão do display flex se não especificarmos) ela vai fazer com que caso o tamamno total da caixas de conteudo sejam maoires que o tamanho total do container pai o tamanho de todos os conteudos vai diminuir para eles caberem dentro do container pai,
    
    flex-wrap: wrap:
    Isso faz com que caso o tamanho total dos conteudos sejam maiores que o container pai ele vai quebrar uma linha e fazer o conteudo ser exibido em outra linha mas ainda dentro do container. a quebra sempre é feita no cross-axis + start do main axis (veja a imagem para ilustrar) ou seja nesse caso que o flex-direction é um row a quebra vai ser para a linha debaixo e como o start do main axis é na esquerda o contudo vai para a proxima linha abaixo començando na esquerda se fosse um row-reverse seria parecido apenas a conteudo iria para a linha debaixo mas começaria na direita da pagina já que invertemos o main-axis


    flex-wrap: wrap-reverse:
    Vai fazer parecido com o wrap mas reverso, então ele ainda vai seguir o cross axis mas agora ao contario, nesse exemplo como é um row a quebra é feita para a linha de cima já que esse seria o cross end axis desse flex-direction

    Também temos um shorthand para o flex direction + flex warp, podemos usar o flex-flow: e declarar os conteudos

  -->
   
  <body>
    <div class="container">
      <div class="item">Exemplo de Bloco: A</div>
      <div class="item">Exemplo de Bloco: B</div>
      <div class="item">Exemplo de Bloco: C</div>
      <div class="item">Exemplo de Bloco: D</div>
      <div class="item">Exemplo de Bloco: E</div>
      <div class="item">Exemplo de Bloco: F</div>
      <div class="item">Exemplo de Bloco: G</div>
    </div>
  </body>
</html>
