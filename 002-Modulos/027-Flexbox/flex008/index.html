<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
      div.container {
        height: 400px;
        display: flex;
        flex-flow: row nowrap;
        align-items: flex-end;
        background-color: aqua;
      }

      div.item {
        background-color: lightcoral;
        text-align: center;
        border: 1px solid black;
        padding: 20px;
      }

      #i1 {
        align-self: auto;
      }

      #i2 {
        align-self: flex-start;
      }

      #i3 {
        align-self: flex-end;
      }

      #i4 {
        align-self: center;
      }

      #i5 {
        align-self: stretch;
      }

      #i6 {
        align-self: start;
      }

      #i7 {
        align-self: end;
      }
    </style>
  </head>

  <!-- Vamos aprender sobre align-self (é uma propriedade do item e precisa se aplicado no item não na caixa)
   Como o nome indica podemos alterar como apenas um item se comporta sempre no cross axis

   temos o auto: que vai herdar a configuração do container flex pai
   start: vai colar o item no cross-start
   end: vai colar no cross-end
   center: vai centralizar o conteudo no cross-axis
   stretch: vai esticar o conteudo até ele preencher todo o espaço do cross
   *Imagem para ilustrar*
    -->

  <body>
    <div class="container">
      <div class="item" id="i1">A</div>
      <div class="item" id="i2">B</div>
      <div class="item" id="i3">C</div>
      <div class="item" id="i4">D</div>
      <div class="item" id="i5">E</div>
      <div class="item" id="i6">F</div>
      <div class="item" id="i7">G</div>
    </div>
  </body>
</html>
