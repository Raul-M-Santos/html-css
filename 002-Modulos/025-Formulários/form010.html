<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <h1>Teste de Formulário</h1>

    <!-- Aqui Somando também usando o JS + o output para exibir os resultados -->

    <form action="sla.php" method="get" autocomplete="on">
      <p>
        <label for="iano">Em que Ano você Nasceu?</label>
        <input
          type="number"
          name="num"
          id="iano"
          min="1950"
          max="2025"
          oninput="calcIdade()"
        />
      </p>
      <p>
        <label for="iidade">Sua idade é</label>
        <output id="iidade">0</output>
      </p>

      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>

    <script>
      function calcIdade() {
        let atual = new Date().getFullYear();
        iidade.innerHTML = Number(atual) - Number(iano.value);
      }
    </script>
  </body>
</html>
