<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>

  <!-- Abaixo testando o parametro de input number esse campo vai aceitar apenas numeros
   Um parametro que podemos usar nesse campo é o min para determinar que o valor minimo é 0 e max para determinar que o valor maximo vai ser 10 por exempo 
   
   Podemos também determinar o step do campo (normalmente usado para campos de numero) ele vai determinar de quanto em quanto esse campo vai aceitar valores, o padrão é 1 mas nesse caso por ser um exemplo de notas podemos ter valores decimais, nesse caso podemos usar o step 0. e oque quisermos se usarmos 0.1 ele vai passar de 0.1, 0.2, 0.3 até chegar no 10 que é o max que determinamos nesse campo-->

  <!-- Outro parametro que podemos usar é o value para deixar algo realmente digitado no campo, nesse caso não vai ser apenas visual como no placeholder ele vai realmente deixar algo pre-digitado no campo inclusive se tivermos um placeholder ele não vai aparecer por conta desse value-->
   
  <body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
      <div>
        <label for="inome">Nome:</label>
        <input
          type="text"
          name="nome"
          id="inome"
          maxlength="20"
          minlength="5"
          required
          autocomplete="name"
          placeholder="Seu Nome"
        />
      </div>

      <br />

      <div>
        <label for="imedia">Média:</label>
        <input
          type="number"
          name="media"
          id="imedia"
          min="0"
          max="10"
          placeholder="0 a 10"
          step="0.1"
          required
        />
      </div>

      <br />

      <div>
        <label for="imes">Periodo letivo</label>
        <input
          type="month"
          name="mes"
          id="imes"
          value="2025-05"
          autocomplete="no"
        />
      </div>

      <br />

      <div>
        <label for="idate">Dia da prova</label>
        <input
          type="date"
          name="date"
          id="idate"
          value="2025-05-14"
          autocomplete="no"
        />
      </div>

      <br />

      <div>
        <label for="ihora">Horário da Prova</label>
        <input
          type="time"
          name="hora"
          id="ihora"
          value=""
          autocomplete="off"
          class="hora"
        />
      </div>

      <br />

      <div>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </div>
    </form>
  </body>
</html>
