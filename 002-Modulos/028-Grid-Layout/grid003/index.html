<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout pratica</title>
    <style>
      div.container {
        border: 2px solid blue;
        display: grid;
        grid-template-rows: repeat(3, 80px);
        grid-auto-rows: 80px;
        grid-auto-flow: row;
        grid-template-columns: 1fr 1fr 1fr;
        grid-auto-columns: 120px;
        gap: 10px;
        place-items: normal normal;
        place-content: normal normal;
      }

      div.item {
        border: 2px solid red;
        padding: 5px;
      }
    </style>
  </head>

  <!-- Vamos imaginar uma situação onde temos um grid de 3x3 então cabem 9 items mas pode ser que por alguma situação precisamos adicionar mais um elemento, então digmamos que no html eu adicione a letra "j", nosso container grid vai crecer para acomodar o item "j" mas ele vai ter o tamanho certo do conteudo "j" oque pode ficar desporporcional já que o conteudo em questão por ser apenas uma letra vai criar uma caixa pequena comparada as outras que tem 80px de altura para isso podemos adicionar o grid-auto-row ou columns que é uma declaração que diz se tiverem mais items do que eu tenho linhas nesse container crie uma nova linha com um tamanho x que podemos declarar 
   
  então grid-auto-rows: 80px; vai fazer com que no nosso exemplo caso tenhamos 10 items ou mais o grid vai automaticamente criar uma nova linha para acomodar os novos items mas com um valor de 80px já que foi esse o declarado e caso não tenha o container vai manter apenas as linhas que você já tinha declarado antes, 3 nesse exemplo
  
  Podemos fazer isso para colunas também mas para isso precisamos antes mudar um atributo padrão do grid que é o grid-auto-flow: row; esse seletor basicamente diz como nosso grid vai fazer as quebras (parecido com o wrap no flex) por padrão ele vem como row, ou seja os conteudos seguem uma linha e ao se quebrarem vão para a linha de baixo, mas podemos alterar esse valor para columns, os conteudos vão se portar como colunas e caso aconteça de termos mais conteudos do que colunas ele vai criar uma nova coluna para esse item
  
  parecido com o row essa nova coluna criada vai ter o extato tamanho do item então se quiser que os items que ultrapassem o tamanaho de linhas tanham um tamanho fixo você pode declarar o grid-auto-columns: 120px; isso vai fazer com que ele ao criar essa nova coluna (que ele já cria automaticamente) tenha um valor que você define -->


  <!-- Uma coisa util que podemos fazer é usar frações para declara os tamanhos tanto das rows como das columns e ele vai ter um comportamento parecido com o auto, então repeat(3, 1fr) ou 1fr 1fr 1fr eu estou pedindo para que o grid tenha 3 linhas ou colunas de uma fração que seriam 3 espaços iguais do container
   
  mas porque usar frações ao inves de auto já que elas fazem a mesma coisas? os recursos de frações podem ser mais precisos, digamos que eu queria que uma dessas colunas tenha o dobro do tamanho das outras duas usando o auto eu não conseguiria, teria que calcular o tamanho das outras caixas com o auto e decalrar esse valor dobrado, mas e esse a caixa em questão pode mudar de tamanho no site? fica praticamente impraticavel fazer isso, já com as frações podemos fazer 1fr 2fr 1fr oque eu estou dizendo é, crie 4linhas (já que esse valor é a soma das frações) mas a segunda linha vai ocupar o tamanho de 2 linhas tendo o dobro de tamanho das outras duas simplificando e muito caso você queria alterar o tamanho de uma caixa proporcionalmente as outras
  
  Lembre-se é sempre proporcional entã 1fr 2fr 1fr terá o mesmo efeito viusal de 2fr 4fr 2fr já que a proporção é mesma mas no segundo caso o grid vai criar mas linhas (8 para ser exato) e a primeira caixa ficará com 2 dessas linhas a segunda 4 dessas linhas e a terceira com as ultimas 2 mas viusalmente vai ser a mesma coisa do primeiro exemplo-->
  <body>
    <div class="container">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item">F</div>
      <div class="item">G</div>
      <div class="item">H</div>
      <div class="item">I</div>
      <div class="item">J</div>
    </div>
  </body>
</html>
