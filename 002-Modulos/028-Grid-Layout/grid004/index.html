<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid areas</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <!-- Vamos aprender algumas propriedades de items temos o grid-row-start, grid-row-end, grid-column-start e grid-column-end com elas podemos declarar onde as areas das caixas começam e terminam nesse caso por linha e coluna se eu declarar que as rows são start 1 e end 2 eu estou determinando a altura do dessa caixa e as colunas como start 1 e end 5 eu estou determinando a largura do container, essas linhas são delimitadas pelas mesmas que declaramos quando vamos criar as linhas do grid com o grid-template (de uma olhada na img e vá para o css) -->
  <body>
    <div class="container">
      <div class="caixa0">Caixa 01</div>
      <div class="caixa1">Caixa 02</div>
      <div class="caixa2">Caixa 03</div>
    </div>
  </body>
</html>
